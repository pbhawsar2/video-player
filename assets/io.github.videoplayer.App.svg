<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="vpOuter" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070B13"/>
    </linearGradient>
    <linearGradient id="vpInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
    <linearGradient id="vpPlay" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="vpGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="vpRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Grounded GNOME squircle base -->
  <rect x="8" y="10" width="112" height="110" rx="26" fill="#030509"/>
  <rect x="8" y="8" width="112" height="108" rx="26" fill="url(#vpOuter)" stroke="url(#vpRim)" stroke-width="2"/>

  <!-- Inner cinema aperture -->
  <rect x="16" y="16" width="96" height="92" rx="19" fill="url(#vpInner)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Soft cyan ambient halo -->
  <circle cx="64" cy="60" r="34" fill="url(#vpGlow)"/>

  <!-- Precision geometric play triangle -->
  <path d="M51 37.5 C51 33.8 55.1 31.6 58.2 33.6 L90.8 54.6 C93.6 56.4 93.6 60.6 90.8 62.4 L58.2 83.4 C55.1 85.4 51 83.2 51 79.5 Z"
        fill="url(#vpPlay)"/>
  <!-- Subtle glass highlight along upper-left edge of play triangle -->
  <path d="M53 38.2 C53 35.8 55.6 34.4 57.6 35.7 L87.4 54.9"
        fill="none" stroke="#E0F2FE" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>

  <!-- Minimalist timeline bar & active scrub point -->
  <rect x="28" y="94" width="72" height="4" rx="2" fill="#1E293B"/>
  <rect x="28" y="94" width="40" height="4" rx="2" fill="url(#vpPlay)"/>
  <circle cx="68" cy="96" r="4.2" fill="#F8FAFC" stroke="#38BDF8" stroke-width="2"/>
</svg>
